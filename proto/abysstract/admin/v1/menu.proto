syntax = "proto3";

package abysstract.admin.v1;

import "abysstract/admin/v1/common.proto";
import "google/protobuf/timestamp.proto";

// 菜单资源（M 目录 / C 菜单 / F 按钮）。children 仅作为前端 Tree Table
// 投影字段；标准 List RPC 返回 flat rows，不在后端构建树。
message Menu {
  int64 id = 1;
  string menu_name = 2;
  int64 parent_id = 3;
  int32 order_num = 4;
  string path = 5;
  string component = 6;
  string query = 7;
  int32 is_frame = 8;
  int32 is_cache = 9;
  string menu_type = 10; // M目录 C菜单 F按钮
  int32 visible = 11;
  Status status = 12;
  string perms = 13; // 权限标识，如 system:user:add
  string icon = 14;
  google.protobuf.Timestamp create_time = 15;
  google.protobuf.Timestamp update_time = 16;
  repeated Menu children = 17; // 前端 Tree Table 投影，标准 List 不填充
}

message ListMenusRequest {
  PageRequest page = 1;
  string keyword = 2;
  optional int64 parent_id = 3;
  optional string menu_type = 4;
  optional Status status = 5;
  repeated OrderBy orders = 6;
}
message ListMenusResponse {
  repeated Menu items = 1;
  PageInfo page = 2;
}

message GetMenuRequest {
  int64 id = 1;
}
message GetMenuResponse {
  Menu menu = 1;
}

message CreateMenuRequest {
  string menu_name = 1;
  int64 parent_id = 2;
  int32 order_num = 3;
  string path = 4;
  string component = 5;
  string query = 6;
  int32 is_frame = 7;
  int32 is_cache = 8;
  string menu_type = 9;
  int32 visible = 10;
  string perms = 11;
  string icon = 12;
}
message CreateMenuResponse {
  Menu menu = 1;
}

message UpdateMenuRequest {
  int64 id = 1;
  optional string menu_name = 2;
  optional int64 parent_id = 3;
  optional int32 order_num = 4;
  optional string path = 5;
  optional string component = 6;
  optional string query = 7;
  optional int32 is_frame = 8;
  optional int32 is_cache = 9;
  optional string menu_type = 10;
  optional int32 visible = 11;
  optional string perms = 12;
  optional string icon = 13;
}
message UpdateMenuResponse {
  Menu menu = 1;
}

message DeleteMenuRequest {
  int64 id = 1;
}
message DeleteMenuResponse {}
message BatchDeleteMenusRequest {
  repeated int64 ids = 1;
}
message BatchDeleteMenusResponse {}

// 菜单管理服务：标准 Resource 六操作；MenusOf 动态路由投影仍是专用内部查询。
service MenuService {
  rpc ListMenus(ListMenusRequest) returns (ListMenusResponse);
  rpc GetMenu(GetMenuRequest) returns (GetMenuResponse);
  rpc CreateMenu(CreateMenuRequest) returns (CreateMenuResponse);
  rpc UpdateMenu(UpdateMenuRequest) returns (UpdateMenuResponse);
  rpc DeleteMenu(DeleteMenuRequest) returns (DeleteMenuResponse);
  rpc BatchDeleteMenus(BatchDeleteMenusRequest) returns (BatchDeleteMenusResponse);
}
