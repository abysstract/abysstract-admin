syntax = "proto3";

package abysstract.admin.v1;

import "abysstract/admin/v1/common.proto";
import "google/protobuf/timestamp.proto";

// 系统用户
message User {
  int64 id = 1;
  string username = 2; // 登录账号
  string nickname = 3; // 昵称
  string email = 4;
  string phone = 5;
  Status status = 6;
  int64 dept_id = 7; // 所属部门
  repeated int64 role_ids = 8; // 角色 ID 列表
  string remark = 9;
  google.protobuf.Timestamp create_time = 10;
  google.protobuf.Timestamp update_time = 11;
}

message ListUsersRequest {
  PageRequest page = 1;
  string keyword = 2; // 按账号/昵称模糊查询
  optional Status status = 3;
  optional int64 dept_id = 4;
}

message ListUsersResponse {
  repeated User items = 1;
  PageInfo page = 2;
}

message GetUserRequest {
  int64 id = 1;
}

message GetUserResponse {
  User user = 1;
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  string nickname = 3;
  string email = 4;
  string phone = 5;
  int64 dept_id = 6;
  repeated int64 role_ids = 7;
  string remark = 8;
}

message CreateUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  int64 id = 1;
  optional string nickname = 2;
  optional string email = 3;
  optional string phone = 4;
  optional int64 dept_id = 5;
  repeated int64 role_ids = 6;
  optional string remark = 7;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  int64 id = 1;
}

message DeleteUserResponse {}

message BatchDeleteUsersRequest {
  repeated int64 ids = 1;
}

message BatchDeleteUsersResponse {
  int32 deleted = 1;
}

message ChangeUserStatusRequest {
  int64 id = 1;
  Status status = 2;
}

message ChangeUserStatusResponse {}

message ResetPasswordRequest {
  int64 id = 1;
  string new_password = 2;
}

message ResetPasswordResponse {}

// 用户管理服务
service UserService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc BatchDeleteUsers(BatchDeleteUsersRequest) returns (BatchDeleteUsersResponse);
  rpc ChangeUserStatus(ChangeUserStatusRequest) returns (ChangeUserStatusResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
}
