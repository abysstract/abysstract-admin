syntax = "proto3";

package abysstract.admin.v1;

import "abysstract/admin/v1/menu.proto";
import "abysstract/admin/v1/user.proto";

message LoginRequest {
  string username = 1;
  string password = 2;
  // 验证码挑战 ID：GetCaptcha 返回的 id。第三方验证（Turnstile、hCaptcha）不需要。
  string captcha_id = 3;
  // 验证码答案：第三方验证组件给出的 token，或对 GetCaptcha 挑战的作答（格式由 kind 决定）。
  string captcha = 4;
}

// 登录失败时附在 Connect 错误上的 detail，告诉客户端下一次登录是否需要验证码。
// 只在需要验证码或验证码有问题时附带。
message LoginChallenge {
  bool captcha_required = 1; // 下一次登录需要带验证码
  CaptchaError captcha_error = 2; // 本次被拒是因为验证码
}

enum CaptchaError {
  CAPTCHA_ERROR_UNSPECIFIED = 0;
  CAPTCHA_ERROR_MISSING = 1; // 需要验证码但没有提供
  CAPTCHA_ERROR_INVALID = 2; // 验证码错误、过期或已使用
}

message GetCaptchaRequest {}

// 一个验证码挑战。未启用验证码时 GetCaptcha 返回 FailedPrecondition。
message GetCaptchaResponse {
  string kind = 1; // 渲染组件：slide（内置滑块）、turnstile、hcaptcha 或应用自定义
  string payload = 2; // 交给组件的 JSON，格式由 kind 决定
  string id = 3; // 登录时作为 captcha_id 提交；第三方验证为空
  int64 expires_in = 4; // 挑战有效期（秒）；0 表示由第三方决定
}

message LoginResponse {
  string token = 1; // JWT
  int64 expires_in = 2; // 有效期（秒）
  string refresh_token = 3; // 刷新令牌（仅启用刷新令牌时返回；否则为空）
}

// 使用 Google 登录。id_token 是 Google Identity Services 返回的 ID token（credential）。
// 只有邮箱已匹配到后台用户的 Google 账号能登录；未启用 Google 登录时返回 FailedPrecondition。
message LoginWithGoogleRequest {
  string id_token = 1;
}

message GetLoginOptionsRequest {}

// 登录页可用的登录方式。
message GetLoginOptionsResponse {
  string google_client_id = 1; // 非空表示启用了 Google 登录；前端用它初始化 Google 按钮
}

message LogoutRequest {}
message LogoutResponse {}

// 改密请求：旧密码 + 新密码。服务端校验旧密码 + 复杂度策略，成功后递增 token_version。
message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}
message ChangePasswordResponse {}

// 刷新令牌：用未过期且未吊销的 refresh_token 换取新的访问令牌。
// 仅在服务端启用刷新令牌特性时可用，否则返回 Unimplemented。
message RefreshTokenRequest {
  string refresh_token = 1;
}
message RefreshTokenResponse {
  string token = 1; // 新的访问令牌（JWT）
  int64 expires_in = 2; // 有效期（秒）
  string refresh_token = 3; // 轮转后的新刷新令牌（若启用轮转）
}

message GetUserInfoRequest {}

message GetUserInfoResponse {
  User user = 1;
  repeated string roles = 2; // 角色标识，如 ["admin"]
  repeated string permissions = 3; // 按钮/操作权限标识，如 ["system:user:add"]
  repeated Menu menus = 4; // 用户可见菜单树（目录 M + 菜单 C），驱动前端动态菜单与路由
  bool pwd_reset_required = 5; // true 表示首次登录/被重置后需改密，前端应弹出改密对话框
}

// 认证服务（Login / LoginWithGoogle / GetLoginOptions / GetCaptcha / RefreshToken 无需鉴权，其余需要 Bearer token）
service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc LoginWithGoogle(LoginWithGoogleRequest) returns (LoginResponse);
  rpc GetLoginOptions(GetLoginOptionsRequest) returns (GetLoginOptionsResponse);
  rpc GetCaptcha(GetCaptchaRequest) returns (GetCaptchaResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
}
