syntax = "proto3";

package abysstract.admin.v1;

import "abysstract/admin/v1/common.proto";
import "google/protobuf/timestamp.proto";

// 部门资源（标准平铺 CRUD）。parent_id/ancestors 仍由后端维护层级完整性，
// 但 wire 不再暴露旧的 children 树响应。
message Dept {
  int64 id = 1;
  int64 parent_id = 2;
  string dept_name = 3;
  int32 order_num = 4;
  string leader = 5;
  string phone = 6;
  string email = 7;
  Status status = 8;
  google.protobuf.Timestamp create_time = 9;
  google.protobuf.Timestamp update_time = 10;
  repeated Dept children = 11; // 前端 Tree Table 投影字段；标准 List 返回时由页面组装
}

message ListDeptRowsRequest {
  PageRequest page = 1;
  string keyword = 2;
  optional int64 parent_id = 3;
  optional Status status = 4;
  repeated OrderBy orders = 5;
}
message ListDeptRowsResponse {
  repeated Dept items = 1;
  PageInfo page = 2;
}

message GetDeptRequest {
  int64 id = 1;
}
message GetDeptResponse {
  Dept dept = 1;
}

message CreateDeptRequest {
  int64 parent_id = 1;
  string dept_name = 2;
  int32 order_num = 3;
  string leader = 4;
  string phone = 5;
  string email = 6;
}
message CreateDeptResponse {
  Dept dept = 1;
}

message UpdateDeptRequest {
  int64 id = 1;
  optional int64 parent_id = 2;
  optional string dept_name = 3;
  optional int32 order_num = 4;
  optional string leader = 5;
  optional string phone = 6;
  optional string email = 7;
}
message UpdateDeptResponse {
  Dept dept = 1;
}

message DeleteDeptRequest {
  int64 id = 1;
}
message DeleteDeptResponse {}
message BatchDeleteDeptsRequest {
  repeated int64 ids = 1;
}
message BatchDeleteDeptsResponse {}

// 部门管理服务：只保留标准 Resource 六操作。
service DeptService {
  rpc ListDeptRows(ListDeptRowsRequest) returns (ListDeptRowsResponse);
  rpc GetDept(GetDeptRequest) returns (GetDeptResponse);
  rpc CreateDept(CreateDeptRequest) returns (CreateDeptResponse);
  rpc UpdateDept(UpdateDeptRequest) returns (UpdateDeptResponse);
  rpc DeleteDept(DeleteDeptRequest) returns (DeleteDeptResponse);
  rpc BatchDeleteDepts(BatchDeleteDeptsRequest) returns (BatchDeleteDeptsResponse);
}
